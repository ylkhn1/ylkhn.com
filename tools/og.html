<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #0a0e12; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; color: #d7dee6; position: relative; }
  .glow { position: absolute; inset: -30% 0 auto 0; height: 60%; background: radial-gradient(50% 60% at 50% 0%, rgba(126,231,135,.12), transparent 70%); }
  .term { position: absolute; left: 100px; top: 95px; width: 1000px; height: 440px; background: #0f161c; border: 2px solid #1e2a33; border-radius: 20px; overflow: hidden; }
  .bar { height: 56px; background: #121a21; border-bottom: 2px solid #1e2a33; display: flex; align-items: center; padding: 0 26px; gap: 12px; }
  .bar i { width: 16px; height: 16px; border-radius: 50%; background: #3b4650; display: block; }
  .bar span { flex: 1; text-align: center; margin-right: 72px; font: 20px "JetBrains Mono", monospace; color: #5c6b78; }
  .body { padding: 36px 56px; }
  .cmd { font: 28px "JetBrains Mono", monospace; color: #d7dee6; margin: 0 0 22px; }
  .cmd b { color: #7ee787; font-weight: 400; margin-right: 10px; }
  h1 { margin: 0 0 16px; font-size: 88px; letter-spacing: -0.03em; line-height: 1; color: #fff; font-weight: 700; }
  p { margin: 0; font: 27px/1.45 "JetBrains Mono", monospace; color: #8a98a6; max-width: 860px; }
  .cur { display: inline-block; width: 18px; height: 34px; background: #7ee787; vertical-align: -6px; margin-left: 6px; box-shadow: 0 0 14px rgba(126,231,135,.5); }
  .chips { position: absolute; left: 56px; bottom: 40px; display: flex; gap: 14px; }
  .chip { font: 22px "JetBrains Mono", monospace; padding: 12px 16px; border: 2px solid #2a3945; border-radius: 10px; background: #0a0e12; color: #d7dee6; }
  .chip.a { color: #7ee787; border-color: #7ee787; background: rgba(126,231,135,.14); }
  .url { position: absolute; right: 56px; bottom: 52px; font: 22px "JetBrains Mono", monospace; color: #5c6b78; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="term">
    <div class="bar"><i></i><i></i><i></i><span>yelkhan@ylkhn.com:~</span></div>
    <div class="body">
      <div class="cmd"><b>$</b>whoami</div>
      <h1>Yelkhan</h1>
      <p>Full-stack developer, big data background.<br>Builds projects from zero to production.<span class="cur"></span></p>
    </div>
    <div class="chips"><span class="chip">go</span><span class="chip">python</span><span class="chip">react</span><span class="chip a">linux</span></div>
    <div class="url">ylkhn.com</div>
  </div>
</body>
</html>
